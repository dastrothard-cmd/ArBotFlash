name: Taxa Registry Tests

on:
  pull_request:
    paths:
      - services/taxa_registry/**
      - .github/workflows/taxa-registry-tests.yml
  push:
    branches:
      - main
    paths:
      - services/taxa_registry/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile registry tools
        run: python -m compileall -q services/taxa_registry
      - name: Run registry tests
        run: python -m unittest discover -s services/taxa_registry/tests -p 'test_*.py' -v
